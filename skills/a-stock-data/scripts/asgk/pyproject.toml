[project]
name = "asgk"
version = "0.1.0"
description = "A股数据共享库（业务取数 + CLI）"
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.1",
    "mootdx>=0.11.7",
    "requests>=2.31",
    "mini-racer>=0.14.1",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "curl-cffi>=0.15.0",
]

[project.scripts]
asgk = "asgk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 包源码在 asgk/ 子目录（标准布局）
packages = ["asgk"]

[dependency-groups]
dev = [
    "pytest>=8",
]
