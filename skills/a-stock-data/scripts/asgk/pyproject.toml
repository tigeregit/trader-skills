[project]
name = "asgk"
version = "0.1.0"
description = "A股数据共享库（业务取数 + CLI）"
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.1",
    "mootdx>=0.11.7",
    "requests>=2.31",
]

[project.scripts]
# asgk CLI（P1 scripts-library-port 后期填充入口）
# asgk = "asgk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 包源码在 asgk/ 子目录（标准布局）
packages = ["asgk"]
