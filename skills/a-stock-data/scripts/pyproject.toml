[project]
name = "asgk"
version = "0.1.0"
description = "A股数据共享库与流量网关（trader-skills 项目）"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
# 网关启动命令: sgw-proxy（等价 python sgw_proxy.py）
sgw-proxy = "sgw_proxy:main"
# asgk CLI（P1 scripts-library-port 时填充入口，P0 暂占位）
# asgk = "asgk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# asgk 是包，sgw_proxy.py 是顶层模块，都打进 wheel
packages = ["asgk"]
only-include = ["asgk", "sgw_proxy.py"]

[dependency-groups]
# 开发依赖（测试用，P4 补充 locust 等）
dev = []
