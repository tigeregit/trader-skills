[project]
name = "sgw"
version = "0.3.1"
description = "A股数据共享流量网关（独立部署的基础设施）"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "curl_cffi>=0.7",
]

[project.scripts]
sgw-proxy = "sgw.proxy:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 包源码在 sgw/ 子目录（标准布局：项目根/包名/源码）
packages = ["sgw"]

[tool.hatch.build]
# config.toml 随包安装（在 sgw/sgw/ 内，会被 packages 自动包含）
