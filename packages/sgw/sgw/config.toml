# sgw_proxy 配置：限流组 / 五档缓存 TTL / 兜底分流规则
# 详见 .agents/notes/gateway-design.md

[server]
host = "127.0.0.1"
port = 7700

# ── 按域名组限流（§3.3）──────────────────────────────────────
# 每组独立令牌桶：rps=每秒请求数，jitter=随机抖动区间(秒)
# 全局串行：所有 agent 进程共享这一个网关出口，令牌桶在网关进程内
[[group]]
name = "eastmoney"
domains = [
    "push2.eastmoney.com", "push2his.eastmoney.com", "push2ex.eastmoney.com",
    "data.eastmoney.com", "datacenter-web.eastmoney.com", "datacenter.eastmoney.com",
    "emweb.securities.eastmoney.com",
    "reportapi.eastmoney.com", "emappdata.eastmoney.com", "kuaixun.eastmoney.com",
    "quote.eastmoney.com", "so.eastmoney.com",
    "search-api-web.eastmoney.com", "np-weblist.eastmoney.com",
]
rps = 1.0          # 对齐上游 EM_MIN_INTERVAL=1.0
jitter = [0.1, 0.5]

[[group]]
name = "10jqka"
domains = [
    "basic.10jqka.com.cn", "data.10jqka.com.cn",
    "zx.10jqka.com.cn", "dq.10jqka.com.cn",
]
rps = 1.5
jitter = [0.1, 0.4]

# ── 交易所源（独立组，与东财不同风控面）──────────────────────
# 决策10（§7）：深交所融资融券官方容灾源，带 Referer 经网关
[[group]]
name = "exchange"
domains = [
    "www.szse.cn", "query.sse.com.cn",
]
rps = 0.5          # 交易所更保守（2秒1次）
jitter = [0.5, 1.0]

# ── 端点策略（准入 / IP 风险 / 响应作用域三轴正交）──────────
# 未匹配端点一律 unknown 并拒绝，不能仅因 host 已归组就出网。
# 当前 sgw 是公共数据网关，因此已批准端点均为 controlled + public + shared。

