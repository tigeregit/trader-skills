[circuit]
# 家庭 IP 无法快速更换：403/429 在代码中立即熔断；以下控制普通故障。
cooldown_seconds = 300
failure_threshold = 3
probe_lease_seconds = 120

[state]
# 熔断状态独立持久化；不依赖 P/L 缓存是否启用。
enabled = true
dir = "state"
# 状态库异常后只探测存储，不访问上游；24h 为上限。
backoff_seconds = [600, 1800, 3600, 21600, 43200, 86400]

[retry]
# 生产默认允许普通瞬态故障重试；真实 canary 用临时配置设为 1。
max_attempts = 3

# ── 五档缓存 TTL（§3.4.2）───────────────────────────────────
# 档位由 asgk 库用 X-Cache-Tier 头声明（§3.4.6 先验方案）
[cache]
P_ttl = 2592000           # 30天：研报/公告/分红/F10/互动易（发布即定稿）
L_ttl = 86400             # 1天：季报快照/财报三表/股东户数（季度更新）
# S 档分时段（§3.4.3）：盘中不缓存避免脏数据，盘后定稿缓存12h
S_ttl_session = 0         # 盘中(09:00-18:00)：no-cache
S_ttl_afterclose = 43200  # 盘后(18:00-次日09:00)：12h
R_ttl = 0                 # 实时：no-cache
N_ttl = 0                 # 流式新闻：no-cache

# 交易时段简化判断（MVP）：工作日 09:00-18:00 视为盘中
# P4 实测时校准为真实交易日历
[cache.session]
intraday_start = "09:00"
intraday_end = "18:00"

# ── 磁盘持久化（§3.4.8）──────────────────────────────────────
# 仅 P/L 档落盘，重启后恢复，避免冷启动重打外网。S 盘中易脏、R/N 不缓存。
[cache.persist]
enabled = true
dir = "cache"          # 相对包目录；生产建议 --cache-dir /var/lib/sgw
tiers = ["P", "L"]     # 仅持久化这两档

# ── 兜底分流规则（§3.4.6）───────────────────────────────────
# 未声明 X-Cache-Tier 的裸请求（curl/第三方直连）走这里
[fallback]
default_tier = "R"        # 未识别一律 R（no-cache）：宁缺毋滥，避免脏读

[[fallback.rules]]
path_contains = "/report/list"
tier = "P"

[[fallback.rules]]
path_contains = "/api/qt/stock/fflow/daykline"
tier = "S"

# ── 响应指纹日志（§3.4.7 离线修正）──────────────────────────
[fingerprint]
enabled = true
# 日志目录：生产环境必须指定（如 /var/log/sgw）；默认在网关包目录下
# 文件按天自动拆分：sgw_fp_YYYYMMDD.jsonl，避免超大文件
log_dir = "logs"
# 哈希前剔除的动态字段（这些每次都变，会污染变更检测）
strip_fields = ["req_trace", "servertime", "server_time", "request_id", "trace_id"]
