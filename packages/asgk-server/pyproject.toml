[project]
name = "asgk-server"
version = "1.1.0"
description = "能力代理服务端 + asgk CLI：吞噬 sgw 流量内核，按数据域暴露语义能力"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "curl_cffi>=0.7",
    "mootdx>=0.11",
    "lxml>=5.0",
]

# CLI 的 --format xlsx 路径需要 pandas/openpyxl，按需安装（延迟 import）。
# 用法：uv tool install "asgk-server[xlsx]"
[project.optional-dependencies]
xlsx = ["pandas>=2.0", "openpyxl>=3.1"]

[project.scripts]
asgk-server = "asgk_server.server:main"
asgk = "asgk_server.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asgk_server"]

[tool.hatch.build]
# config.toml + cli/cli.toml.default 随包安装（在 asgk_server/ 内，会被 packages 自动包含）
